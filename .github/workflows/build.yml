name: Build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Build app bundle
        run: ./build.sh
      - name: Check for warnings
        run: |
          swift build -c release 2>&1 | tee build.log
          ! grep -q "warning:" build.log
      - name: Upload app
        uses: actions/upload-artifact@v4
        with:
          name: Net-Inspector
          path: build/Net Inspector.app
